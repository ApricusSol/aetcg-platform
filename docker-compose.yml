networks:
  aetcg_secure_mesh:
    driver: bridge

services:
  web_api:
    build:
      context: .
      target: runner
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=queue_broker
      - REDIS_PORT=6379
    command: [sh, -c, "python worker.py & uvicorn main:app --host 0.0.0.0 --port 8000"]
    networks:
      - aetcg_secure_mesh
    depends_on:
      - queue_broker

  queue_broker:
    image: redis:7.2-alpine
    # Explicitly omitting public port bindings blocks external network ingestion vectors entirely
    networks:
      - aetcg_secure_mesh
